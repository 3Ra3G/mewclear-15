# These items should be used for the outer slot. They can provide additional protection or cosmetic appeal. It's mainly aimed towards Wastelanders or factions that aren't an official faction yet.
# Armor / Coats  / Other 

# Armor

- type: loadout
  id: MisfitsLoadoutOuterMarkedMenCombatTribalArmor
  category: Armor
  cost: 6
  exclusive: true
  requirements:
    - !type:CharacterItemGroupRequirement
      group: NWLoadoutOuter
    - !type:CharacterSpeciesRequirement
      species:
        - Ghoul
        - GhoulGlowing
    - !type:CharacterDepartmentTimeRequirement # T6 faction timelock (20h NCR)
      department: CaesarLegion
      min: 18000 # 5 hours
    - !type:CharacterDepartmentRequirement
      departments:
        - Wastelander
  items:
    -  M14ClothingOuterMarkedMenCombatTribalArmor

